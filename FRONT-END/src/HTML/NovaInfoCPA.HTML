<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/header.css">
    <link rel="stylesheet" href="../CSS/form.css">
    <link rel="stylesheet" href="../CSS/footer.css">
    <title>GERENCIAMENTO - CPA</title>
</head>

<body>
    <header id="header">
        <h1>BEM VINDO AO GERENCIADOR DE OPERAÇÕES!!</h1>
    </header>
    <main id="content">
        <div id="div_form">
            <form id="informations_form">
                <div id="capital_inicial">
                    <label for="valor_inicial" class="form_label">Valor inicial:</label>
                    <br><input type="number" id="valor_inicial" required class="form_input">
                </div>
                <div id="capital_inicial">
                    <label for="valor_final" class="form_label">Valor final:</label>
                    <br><input type="number" id="valor_inicial" required class="form_input">
                </div>
                <div id="plataforma">
                    <label for="plataforma" class="form_label">Plataforma usada:</label>
                    <br><input type="text" id="plataforma" required class="form_input">
                </div>
                <div id="observações">
                    <label for="observações" class="form_label">Observações:</label>
                    <br><textarea rows="10" cols="50" id="observações" class="form_text_area"></textarea>
                </div>
                <div id="submit">
                    <button>
                        Obter resultado
                    </button>
                </div>
            </form>
        </div>
        <footer id="footer">
            <a href="../../index.html
            ">
                <button id="voltar_button">
                    VOLTAR
                </button>
            </a>

        </footer>
    </main>
</body>

</html>
